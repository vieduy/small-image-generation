# h200-gpu-fleet; dev-duyhv itself sits on h200-120-fleet). Same image + /mnt/project/kchat volume as dev-duyhv.
image: pytorch/pytorch:2.9.1-cuda12.8-cudnn9-devel
ide: vscode

