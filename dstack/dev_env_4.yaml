type: dev-environment
name: dev-duyhv-4

# i2i-sticker-avatar: 1 H200 NVL on h200-120-fleet (retry for a healthy GPU) (user request 2026-11-19 ~15:35 VN) while dev-duyhv's 2 GPUs on
# h200-120-fleet need a host reset ("GPU requires reset" since ~07:19 UTC). Same image + /mnt/project/kchat volume.
image: pytorch/pytorch:2.9.1-cuda12.8-cudnn9-devel
ide: vscode

volumes:
  - /mnt/project/kchat:/mnt/project/kchat

fleets:
  - h200-120-fleet

resources:
  gpu: H200NVL:1
  shm_size: 64GB
